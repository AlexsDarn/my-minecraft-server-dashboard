<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Minecraft Dashboard{% endblock %}</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.4/dist/htmx.min.js"></script>
  <link rel="stylesheet" href="/static/css/output.css" />
</head>
<body class="min-h-screen bg-zinc-950 text-zinc-100">
  <header class="border-b border-zinc-800">
    <nav class="mx-auto flex max-w-5xl items-center justify-between px-4 py-3">
      <a href="/" class="font-bold tracking-tight">⛏️ Minecraft Dashboard</a>
      <div class="flex gap-4 text-sm text-zinc-400">
        <a href="/" class="hover:text-zinc-100">Estado</a>
        <a href="/admin" class="hover:text-zinc-100">Admin</a>
        <a href="/api/status" class="hover:text-zinc-100">API</a>
      </div>
    </nav>
  </header>
  <main class="mx-auto max-w-5xl px-4 py-6">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
